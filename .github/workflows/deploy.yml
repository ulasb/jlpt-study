name: Deploy to GitHub Pages

# Build and publish the site on every push to main (and on-demand via the
# Actions tab → "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs: read the code, write to Pages, and mint the
# OIDC token Pages uses to verify the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set these as repository Actions *variables* (Settings → Secrets and
      # variables → Actions → Variables). Both are optional and inlined at
      # build time, so changing one needs a fresh deploy to take effect.
      # If unset, analytics stays disabled.
      VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      # If unset, Google Drive sync stays hidden. Not a secret: an OAuth client
      # ID for a browser app is public by design (it's sent to Google in the
      # URL); access is restricted by the client's authorized origins.
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
